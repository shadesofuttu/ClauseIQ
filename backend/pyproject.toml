[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "clauseiq-backend"
version = "0.1.0"
description = "ClauseIQ - AI-powered Document Intelligence Platform"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }

dependencies = [
    # Web framework
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",

    # Configuration
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",

    # Database
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",

    # Auth
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",

    # HTTP client
    "httpx>=0.27.0",

    # Document parsing
    "pypdf>=4.2.0",
    "python-docx>=1.1.0",

    # AI
    "openai>=1.30.0",
    "tiktoken>=0.7.0",

    # Vector store
    "chromadb>=0.5.0",

    # Workers
    "celery>=5.4.0",
    "redis>=5.0.0",

    # Observability
    "structlog>=24.1.0",

    # Utilities
    "python-slugify>=8.0.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",

    # Mocking
    "factory-boy>=3.3.0",
    "faker>=25.0.0",

    # Linting & formatting
    "ruff>=0.4.0",
    "mypy>=1.10.0",

    # Pre-commit
    "pre-commit>=3.7.0",

    # Dev utilities
    "ipython>=8.24.0",
    "rich>=13.7.0",
]

prod = [
    "gunicorn>=22.0.0",
    "sentry-sdk[fastapi]>=2.4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

# --- Pytest ---
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error", "ignore::DeprecationWarning"]

# --- Ruff (Linter + Formatter) ---
[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults (FastAPI depends)
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# --- Mypy ---
[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

# --- Coverage ---
[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "alembic/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
